name: Frontend security gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "31 3 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
        env:
          BACKEND_API_URL: http://127.0.0.1:3001/api/v1
      - run: npm sbom --sbom-format cyclonedx > frontend-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-sbom
          path: frontend-sbom.cdx.json
          retention-days: 14

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4

